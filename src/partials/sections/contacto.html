<!-- Sección 11 Contacto -->
<section class="contact" id="contacto" data-t="blue" data-tone="blue" aria-labelledby="h-con">
  <div class="wrap"><div class="inner">
    <p class="sec-name">Contacto</p>
    <div class="mega-box" style="padding-top:28px"><h2 class="mega" id="h-con" data-fit>Conversemos.</h2></div>
    <div class="g contact-g">
      <div class="contact-side">
        <p class="lede">Cuéntanos qué necesitas: equipos, mantenimiento o ciberseguridad.</p>
        <dl class="cdata" id="cdata" hidden></dl>
      </div>
      <form class="form" id="form" novalidate>
        <div class="fld"><label for="f-nombre">Nombre</label><input id="f-nombre" name="nombre" autocomplete="name" required><span class="err" aria-live="polite"></span></div>
        <div class="fld"><label for="f-empresa">Empresa</label><input id="f-empresa" name="empresa" autocomplete="organization"></div>
        <div class="fld"><label for="f-correo">Correo</label><input id="f-correo" name="correo" type="email" autocomplete="email" inputmode="email" required><span class="err" aria-live="polite"></span></div>
        <div class="fld"><label for="f-telefono">Teléfono</label><input id="f-telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel"></div>
        <fieldset class="chips"><legend>Área de interés</legend><div>
          <label><input type="radio" name="interes" id="f-i0" value="Venta de equipos"><span>Venta de equipos</span></label>
          <label><input type="radio" name="interes" id="f-i1" value="Mantenimiento"><span>Mantenimiento</span></label>
          <label><input type="radio" name="interes" id="f-i2" value="Ciberseguridad"><span>Ciberseguridad</span></label>
          <label><input type="radio" name="interes" id="f-i3" value="Por definir" checked><span>Por definir</span></label>
        </div></fieldset>
        <div class="fld full"><label for="f-mensaje">Mensaje</label><textarea id="f-mensaje" name="mensaje" rows="4" required></textarea><span class="err" aria-live="polite"></span></div>
        <div class="hp" aria-hidden="true"><label for="f-web">No completar</label><input id="f-web" name="web" tabindex="-1" autocomplete="off"></div>
        <div class="fld vfy"><span class="vfy-l">Verificación</span><div id="recaptcha" class="rc"></div><span class="err" aria-live="polite"></span></div>
        <div class="fld full ok-box"><label class="consent" for="f-acepto"><input type="checkbox" id="f-acepto" name="acepto" required><span>Acepto la <a href="privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</span></label><span class="err" aria-live="polite"></span></div>
        <div class="form-foot">
          <button class="btn btn-1" type="submit">Enviar mensaje</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </div></div>
</section>
